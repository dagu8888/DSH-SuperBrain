<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#8b8f9e"/>
    </marker>
    <marker id="arrP" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7c5cff"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#0f1117"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f2f3f7">DSH · SuperBrain 云记忆架构</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#8b8f9e">一处书写 · 三处同步 · Agent 全天候自动整理</text>

  <!-- 本地 -->
  <rect x="30" y="100" width="250" height="400" rx="14" fill="#171a23" stroke="#2a2e3c"/>
  <text x="155" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#f2f3f7">你的电脑（Windows）</text>
  <rect x="52" y="152" width="206" height="64" rx="10" fill="#1e222e" stroke="#3a3f52"/>
  <text x="155" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#7c5cff">Obsidian</text>
  <text x="155" y="198" text-anchor="middle" font-size="11" fill="#8b8f9e">写笔记 · 看知识库</text>
  <rect x="52" y="230" width="206" height="64" rx="10" fill="#1e222e" stroke="#3a3f52"/>
  <text x="155" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#f2f3f7">super-brain 仓库</text>
  <text x="155" y="276" text-anchor="middle" font-size="11" fill="#8b8f9e">00-Inbox → 90-System</text>
  <rect x="52" y="308" width="206" height="76" rx="10" fill="#1e222e" stroke="#3a3f52"/>
  <text x="155" y="334" text-anchor="middle" font-size="14" font-weight="600" fill="#f2f3f7">本地 Agents</text>
  <text x="155" y="354" text-anchor="middle" font-size="11" fill="#8b8f9e">grok-bot · mausbot · 你</text>
  <text x="155" y="372" text-anchor="middle" font-size="11" fill="#8b8f9e">sync.sh 定时同步</text>
  <rect x="52" y="400" width="206" height="76" rx="10" fill="#241d3a" stroke="#7c5cff"/>
  <text x="155" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#c9bfff">双联云记忆</text>
  <text x="155" y="446" text-anchor="middle" font-size="11" fill="#a79bde">Obsidian 编辑 ⇄ Git 同步</text>
  <text x="155" y="464" text-anchor="middle" font-size="11" fill="#a79bde">换机不失忆 · 多端一致</text>

  <!-- GitHub -->
  <rect x="365" y="190" width="230" height="180" rx="14" fill="#171a23" stroke="#7c5cff" stroke-width="2"/>
  <text x="480" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#f2f3f7">GitHub 私有仓库</text>
  <text x="480" y="244" text-anchor="middle" font-size="12" fill="#7c5cff" font-weight="600">唯一信息源</text>
  <text x="480" y="278" text-anchor="middle" font-size="11" fill="#8b8f9e">全量历史可回溯</text>
  <text x="480" y="298" text-anchor="middle" font-size="11" fill="#8b8f9e">免费 · 私有 · 永不丢</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#565b6e">pull --rebase ⇄ push</text>

  <!-- 云服务器 -->
  <rect x="680" y="100" width="250" height="400" rx="14" fill="#171a23" stroke="#2a2e3c"/>
  <text x="805" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#f2f3f7">云服务器 7×24</text>
  <text x="805" y="150" text-anchor="middle" font-size="11" fill="#8b8f9e">阿里云香港 2C2G · ¥56/月</text>

  <rect x="702" y="164" width="206" height="52" rx="10" fill="#241d3a" stroke="#7c5cff"/>
  <text x="805" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#c9bfff">Router 总台</text>
  <text x="805" y="203" text-anchor="middle" font-size="10" fill="#a79bde">60s 扫描 Inbox · 派单</text>

  <rect x="702" y="228" width="206" height="76" rx="10" fill="#1e222e" stroke="#3a3f52"/>
  <text x="805" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f3f7">3 个 Worker</text>
  <text x="805" y="268" text-anchor="middle" font-size="10" fill="#8b8f9e">knowledge 整理 · chat 对话</text>
  <text x="805" y="285" text-anchor="middle" font-size="10" fill="#8b8f9e">code 代码 · 心跳 15s 判死线</text>

  <rect x="702" y="316" width="206" height="52" rx="10" fill="#1e222e" stroke="#3a3f52"/>
  <text x="805" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#f2f3f7">看门狗 Watchdog</text>
  <text x="805" y="355" text-anchor="middle" font-size="10" fill="#8b8f9e">10 分钟巡检 · 异常自愈</text>

  <rect x="702" y="380" width="206" height="52" rx="10" fill="#13281c" stroke="#2f9e6e"/>
  <text x="805" y="401" text-anchor="middle" font-size="13" font-weight="600" fill="#6ee7a8">DeepSeek LLM</text>
  <text x="805" y="419" text-anchor="middle" font-size="10" fill="#7fb598">Inbox 笔记全自动分类归档</text>

  <text x="805" y="462" text-anchor="middle" font-size="11" fill="#565b6e">systemd 自启 · 崩溃自愈</text>
  <text x="805" y="482" text-anchor="middle" font-size="11" fill="#565b6e">30 分钟双向同步</text>

  <!-- 箭头 -->
  <line x1="280" y1="280" x2="360" y2="280" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="360" y1="296" x2="280" y2="296" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="600" y1="280" x2="676" y2="280" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="676" y1="296" x2="600" y2="296" stroke="#7c5cff" stroke-width="2.5" marker-end="url(#arrP)"/>

  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#565b6e">三条铁律：云端唯一信息源 · 万事留痕 · 各管各目录</text>
</svg>
